# 分时雷达 —— Nginx 反向代理（公网 80 统一入口）
# 前端 + API 同源，彻底消除 CORS；API 自身路由带 /api/ 前缀，原样透传

upstream ashare_web {
    server web:3000;
}

upstream ashare_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # API 反代（/api/ 前缀原样透传给 FastAPI）
    location /api/ {
        proxy_pass http://ashare_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;    # 扫描任务 SSE/长轮询响应不缓冲
    }

    # 前端（Next.js standalone）
    location / {
        proxy_pass http://ashare_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
