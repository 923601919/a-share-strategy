# 部署方式：Nginx 反代公网 80 统一入口（前端 + API 同源），JWT 登录保护
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        PIP_INDEX_URL: https://mirrors.cloud.tencent.com/pypi/simple/
    image: ashare-api:latest
    container_name: ashare-api
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ""   # 空串 = 同源相对路径，经 Nginx 反代访问 API
    image: ashare-web:latest
    container_name: ashare-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: ashare-nginx
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "80:80"                    # 公网唯一入口
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
